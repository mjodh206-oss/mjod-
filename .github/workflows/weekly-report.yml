name: Weekly scorecard

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API client
        run: python -m pip install -r requirements.txt
      - name: Verify secrets
        env:
          CLIENT: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          TOKEN: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          if [ -z "$CLIENT" ] || [ -z "$TOKEN" ]; then
            echo "::error::Add the YT_CLIENT_SECRET_JSON and YT_TOKEN_JSON repository secrets first."
            exit 1
          fi
      - name: Fetch analytics
        env:
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: python automation/analytics.py --days 28 > /dev/null
      - name: Upload scorecard
        uses: actions/upload-artifact@v4
        with:
          name: weekly-scorecard
          path: reports/
          retention-days: 90
