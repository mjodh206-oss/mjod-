name: Reply to new comments

# Every 6 hours + manual runs. Dry-run everything locally first:
#   python automation/reply_to_comments.py
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      max_replies:
        description: "Max replies this run (each costs 50 quota units)"
        required: false
        default: "30"
      max_videos:
        description: "How many recent videos to scan"
        required: false
        default: "10"

jobs:
  reply:
    runs-on: ubuntu-latest
    concurrency:
      group: youtube-comment-replies
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API client
        run: python -m pip install -r requirements.txt
      - name: Verify secrets
        env:
          CLIENT: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          TOKEN: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          if [ -z "$CLIENT" ] || [ -z "$TOKEN" ]; then
            echo "::error::Add the YT_CLIENT_SECRET_JSON and YT_TOKEN_JSON repository secrets first (see automation/README.md)."
            exit 1
          fi
      - name: Post safe replies
        env:
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          python automation/reply_to_comments.py \
            --send --yes \
            --max-replies "${{ github.event.inputs.max_replies || '30' }}" \
            --max-videos "${{ github.event.inputs.max_videos || '10' }}"
