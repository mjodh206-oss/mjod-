name: Build Android APK

on:
  push:
    branches:
      - arena/df433a5c-mjod
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Package web app into Android assets
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html styles.css app.js manifest.webmanifest sw.js icon.svg icon-192.png icon-512.png android/app/src/main/assets/www/

      - name: Build APK
        run: gradle -p android assembleDebug --no-daemon

      - name: Publish APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.6
          name: QNC للأندرويد — 1.0.6
          generate_release_notes: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
