name: Build Android APK

on:
  push:
    branches:
      - arena/df433a5c-mjod
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate JavaScript, wallet logic, and Android metadata
        run: |
          node --check app.js
          node --check wallet-core.js
          node --test tests/*.test.js
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from html.parser import HTMLParser
          json.load(open('manifest.webmanifest', encoding='utf-8'))
          for path in ['android/app/src/main/AndroidManifest.xml', 'android/app/src/main/res/xml/backup_rules.xml', 'android/app/src/main/res/xml/data_extraction_rules.xml', 'android/app/src/main/res/values/styles.xml', 'android/app/src/main/res/values-v27/styles.xml']:
              ET.parse(path)
          class CheckHTML(HTMLParser): pass
          CheckHTML().feed(open('index.html', encoding='utf-8').read())
          print('Metadata and markup validation passed')
          PY

      - name: Install Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: '8.14.7'

      - name: Package web app into Android assets
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html styles.css wallet-core.js app.js manifest.webmanifest sw.js icon.svg icon-192.png icon-512.png android/app/src/main/assets/www/

      - name: Run Android unit-test task
        run: gradle -p android testDebugUnitTest --no-daemon

      - name: Run Android Lint
        id: lint
        continue-on-error: true
        run: gradle -p android lintDebug --no-daemon

      - name: Report Android Lint findings
        if: always()
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          report = Path('android/app/build/reports/lint-results-debug.xml')
          if not report.exists():
              print('Android Lint did not produce an XML report.')
              raise SystemExit(0)
          root = ET.parse(report).getroot()
          issues = root.findall('issue')
          summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
          lines = ['## Android Lint report', f'Found **{len(issues)}** issue(s).', '']
          for issue in issues:
              severity = issue.get('severity', 'Unknown')
              issue_id = issue.get('id', 'Lint')
              message = issue.get('message', '').replace('\n', ' ')
              location = issue.find('location')
              filename = location.get('file', '') if location is not None else ''
              lines.append(f'- **{severity} / {issue_id}** `{filename}` — {message}')
              if severity.lower() in ('error', 'fatal'):
                  print(f'::error file={filename}::[{issue_id}] {message}')
              elif severity.lower() == 'warning':
                  print(f'::warning file={filename}::[{issue_id}] {message}')
          summary.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print('\n'.join(lines))
          PY

      - name: Build APK
        if: steps.lint.outcome == 'success'
        run: gradle -p android assembleDebug --no-daemon

      - name: Publish APK download
        if: steps.lint.outcome == 'success'
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: android-v1.0.11
          name: QNC للأندرويد — 1.0.11
          generate_release_notes: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
