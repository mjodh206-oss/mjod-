name: Channel loop

# The whole loop in one scheduled run: validate -> sheets -> queued uploads ->
# comment replies -> scorecard. Runs 5 minutes before the calendar's 17:30 UTC slot.
# It publishes ONLY videos explicitly added to content/publish_queue.json.
on:
  schedule:
    - cron: "25 17 * * *"
  workflow_dispatch:
    inputs:
      steps:
        description: "Comma-separated steps (validate,render,publish,replies,report)"
        required: false
        default: "validate,render,publish,replies,report"
      max_publishes:
        description: "Max uploads this run (quota is ~6/day)"
        required: false
        default: "2"

jobs:
  loop:
    runs-on: ubuntu-latest
    concurrency:
      group: youtube-channel-loop
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API client
        run: python -m pip install -r requirements.txt
      - name: Verify secrets
        env:
          CLIENT: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          TOKEN: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          if [ -z "$CLIENT" ] || [ -z "$TOKEN" ]; then
            echo "::error::Add YT_CLIENT_SECRET_JSON and YT_TOKEN_JSON repo secrets first (docs/ACTIVATION.md). Nothing was published."
            exit 1
          fi
      - name: Run the channel loop
        env:
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          python automation/run_channel.py \
            --send --yes \
            --steps "${{ github.event.inputs.steps || 'validate,render,publish,replies,report' }}" \
            --max-publishes "${{ github.event.inputs.max_publishes || '2' }}"
      - name: Upload scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: channel-loop-report
          path: reports/
          if-no-files-found: ignore
          retention-days: 30
