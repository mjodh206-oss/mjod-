name: Lasq Fawri · Android
on:
  push:
    branches: ['arena/0d4372c5-mjod', main]
    paths: ['app/**', 'fixtures/**', 'scripts/**', 'gradle/**', '*gradle*', '.github/workflows/lasq.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lasq-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v5
        with: { cache-read-only: false }
      - name: Make an installable preview (temporary signing identity)
        shell: bash
        run: |
          set -eu
          pass=$(openssl rand -hex 32)
          echo "::add-mask::$pass"
          keytool -genkeypair -storetype PKCS12 -keystore "$RUNNER_TEMP/preview.p12" -storepass "$pass" -alias lasq -keyalg RSA -keysize 3072 -validity 3650 -dname 'CN=Lasq Fawri Preview'
          export LASQ_KEYSTORE="$RUNNER_TEMP/preview.p12" LASQ_STORE_PASSWORD="$pass" LASQ_PREVIEW=true
          scripts/ci-gradle.sh :app:compileDebugKotlin :app:compileDebugAndroidTestKotlin
          scripts/ci-gradle.sh :app:testDebugUnitTest :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest :fixtures:assembleDebug
          mkdir -p deliver
          cp app/build/outputs/apk/release/*.apk deliver/lasq-fawri-simple-1.1.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs deliver/*.apk
          (cd deliver && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with: { name: lasq-fawri-apk, path: deliver/ }
      - uses: actions/upload-artifact@v4
        with: { name: room-schema, path: app/schemas/ }
      - uses: actions/upload-artifact@v4
        with:
          name: instrumented-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            fixtures/build/outputs/apk/*/debug/*.apk
      - name: Report Room schema
        run: python3 -c 'import glob,json; print("::notice title=Room schema::"+json.dumps(json.load(open(glob.glob("app/schemas/*/2.json")[0])),separators=(",",":")))'
  device:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: { api: [26, 29, 35] }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { name: instrumented-apks, path: test-apks }
      - uses: actions/download-artifact@v4
        with: { name: lasq-fawri-apk, path: release-apk }
      - name: Allow emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: scripts/device-tests.sh
  deliver:
    if: github.ref == 'refs/heads/arena/0d4372c5-mjod' && contains(github.event.head_commit.message, '[deliver apk]')
    needs: [build, device]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { name: lasq-fawri-apk, path: deliver }
      - name: Publish verified APK without replacing any existing release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          (cd deliver && sha256sum -c SHA256SUMS.txt)
          gh release create lasq-v1.1.0-simple.1 deliver/lasq-fawri-simple-1.1.apk deliver/SHA256SUMS.txt --target "$GITHUB_SHA" --prerelease --latest=false --title 'لصق فوري ١٫١ — سجل النسخ المبسّط' --notes-file docs/RELEASE-ar.md
