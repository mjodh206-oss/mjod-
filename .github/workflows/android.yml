name: Android CI

on:
  push:
    branches: ["main", "arena/**"]
    tags: ["majwuda-*"]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create/update the majwuda-v1.0.0 tag and GitHub release with the signed APK"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses and install SDK 35
        run: |
          set -e
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          command -v sdkmanager >/dev/null && SDKMANAGER="$(command -v sdkmanager)"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Assemble release APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleRelease

      - name: Stage APK and checksum
        run: |
          set -e
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/majwuda-v1.0.0.apk
          sha256sum dist/majwuda-v1.0.0.apk | tee dist/majwuda-v1.0.0.apk.sha256
          ls -la dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: majwuda-v1.0.0.apk
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish majwuda-v1.0.0 GitHub release
        if: startsWith(github.ref, 'refs/tags/majwuda-') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="majwuda-v1.0.0"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -f "$TAG"
            git push --force origin "refs/tags/$TAG"
          fi
          sh scripts/release-notes.sh > release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/majwuda-v1.0.0.apk dist/majwuda-v1.0.0.apk.sha256 --clobber
          else
            gh release create "$TAG" \
              dist/majwuda-v1.0.0.apk dist/majwuda-v1.0.0.apk.sha256 \
              --title "مجودة v1.0.0" \
              --notes-file release-notes.md
          fi
