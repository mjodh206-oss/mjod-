name: Validate content pack

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate scripts, hooks and reply bank
        run: python tools/validate_content.py
      - name: Render filming sheets
        run: python tools/render_scripts.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Byte-compile automation scripts
        run: python -m compileall -q automation tools
