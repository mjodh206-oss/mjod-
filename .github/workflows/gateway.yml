name: Gateway CI

on:
  push:
    branches: ["main", "arena/**"]
    paths: ["gateway/**", ".github/workflows/gateway.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run gateway unit tests
        run: node --test gateway/test/*.test.mjs
