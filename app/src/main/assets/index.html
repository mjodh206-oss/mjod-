<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0a14">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'self'; media-src 'self';">
<title>المترجم الصوتي الفوري</title>
<link rel="icon" href="mark.svg">
<link rel="stylesheet" href="style.css">
<script src="ui.js" defer></script>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" class="symbols" aria-hidden="true">
<symbol id="mic" viewBox="0 0 24 24"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5.5 10.5v1.2a6.5 6.5 0 0 0 13 0v-1.2M12 18.3v3.2m-3 0h6"/></symbol>
<symbol id="stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.5"/></symbol>
<symbol id="wave" viewBox="0 0 24 24"><path d="M2 12h2m3-4v8m5-13v18m5-13v8m3-4h2"/></symbol>
<symbol id="settings" viewBox="0 0 24 24"><path d="M4 7h7m4 0h5M4 17h3m4 0h9"/><circle cx="13" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
<symbol id="headphones" viewBox="0 0 24 24"><path d="M4 13v-1a8 8 0 0 1 16 0v1M4 13h3v7H5a1 1 0 0 1-1-1zm16 0h-3v7h2a1 1 0 0 0 1-1z"/></symbol>
<symbol id="speaker" viewBox="0 0 24 24"><path d="M3 10v4h4l5 4V6l-5 4H3zm12-1a4 4 0 0 1 0 6m2.5-8.5a7.5 7.5 0 0 1 0 11"/></symbol>
<symbol id="repeat" viewBox="0 0 24 24"><path d="M4 11a8 8 0 1 1 2 6M4 6v5h5"/></symbol>
<symbol id="swap" viewBox="0 0 24 24"><path d="M3 8h17m-4-4 4 4-4 4M21 16H4m4-4-4 4 4 4"/></symbol>
<symbol id="chevron" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
<symbol id="timeline" viewBox="0 0 24 24"><path d="M4 12h2l2-5 3 10 3-13 3 8h3"/></symbol>
<symbol id="people" viewBox="0 0 24 24"><circle cx="8.5" cy="8" r="2.5"/><circle cx="16.5" cy="9" r="2"/><path d="M3.5 19v-1.5a5 5 0 0 1 10 0V19m2-5a4 4 0 0 1 5 4v1"/></symbol>
<symbol id="hand" viewBox="0 0 24 24"><path d="M9 12V5.5a1.5 1.5 0 0 1 3 0V10l5 .8a2.6 2.6 0 0 1 2.1 3l-.7 4a3 3 0 0 1-3 2.5h-4a3 3 0 0 1-2.5-1.3l-4-5.6a1.5 1.5 0 0 1 2.3-1.9l1.8 1.8z"/></symbol>
<symbol id="travel" viewBox="0 0 24 24"><path d="m3 13 7 1 4.3 6 2-1-2.1-6 5.3-3a2 2 0 0 0-2-3.5l-5.3 3-4.6-4.1-2 1.1 3 5L3 11z"/></symbol>
<symbol id="case" viewBox="0 0 24 24"><rect x="3.5" y="8" width="17" height="12" rx="2"/><path d="M9 8V5h6v3m-11 5h16m-8-1v2"/></symbol>
<symbol id="medical" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8 12h8m-4-4v8"/></symbol>
<symbol id="info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11.5v5m0-9h.01"/></symbol>
<symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
<symbol id="slow" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></symbol>
<symbol id="fast" viewBox="0 0 24 24"><path d="m7 6 5 6-5 6m7-12 5 6-5 6"/></symbol>
<symbol id="play" viewBox="0 0 24 24"><path d="m9 5 10 7-10 7z"/></symbol>
<symbol id="pitch" viewBox="0 0 24 24"><path d="M5 16h4l5-8h5m-4-4 4 4-4 4"/></symbol>
<symbol id="shield" viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 4.5 3 8 7 10 4-2 7-5.5 7-10V6z"/><path d="m9 12 2 2 4-4"/></symbol>
</svg>
<div class="app" id="app" data-state="idle">
  <header class="top">
    <button class="icon-button connection" id="connection" aria-label="جودة الاتصال"><i></i><svg><use href="#timeline"/></svg></button>
    <div class="brand" aria-label="المترجم الصوتي الفوري"><img src="mark.svg" alt=""></div>
    <button class="icon-button" id="settingsButton" aria-label="الإعدادات"><svg><use href="#settings"/></svg></button>
  </header>
  <main class="studio">
    <div class="sound-stage">
      <canvas id="visual" aria-hidden="true"></canvas>
      <div class="orbit" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <button class="mic" id="micButton" aria-label="ابدأ الترجمة" aria-pressed="false"><svg><use id="micIcon" href="#mic"/></svg></button>
      <div class="phase" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="sr-only" id="announcement" aria-live="polite"></div>
    </div>
    <section class="languages" aria-label="اللغتان">
      <button class="language" id="primaryLanguage" aria-label="العربية"><span class="flag" data-flag="ar"></span><svg><use href="#speaker"/></svg></button>
      <button class="icon-button swap" id="swapButton" aria-label="بدّل مكان اللغتين"><svg><use href="#swap"/></svg></button>
      <button class="language" id="secondaryLanguage" aria-label="اختر اللغة الأخرى"><span class="flag" data-flag="en"></span><svg><use href="#chevron"/></svg></button>
    </section>
  </main>
  <footer class="dock" aria-label="أدوات المحادثة">
    <button class="icon-button tool" id="repeatButton" aria-label="أعد الترجمة الأخيرة"><svg><use href="#repeat"/></svg></button>
    <nav class="modes" id="quickModes" aria-label="أوضاع المحادثة"></nav>
    <button class="icon-button tool" id="routeButton" aria-label="مخرج الصوت"><svg><use id="routeIcon" href="#speaker"/></svg></button>
  </footer>
</div>
<div class="sheet-layer" id="sheetLayer" hidden>
  <div class="scrim" id="scrim"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="الإعدادات">
    <div class="sheet-handle" aria-hidden="true"></div>
    <button class="icon-button close" id="closeSheet" aria-label="إغلاق"><svg><use href="#close"/></svg></button>
    <div class="sheet-content" id="sheetContent"></div>
  </section>
</div>
<div class="splash" id="splash" hidden>
  <img src="mark.svg" alt="">
  <p>تم تطوير وتنفيذ هذا التطبيق بواسطة أمجد حبيب</p>
</div>
</body>
</html>
