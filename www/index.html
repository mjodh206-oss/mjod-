<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0A1430">
<title>QnS — إدارة الإيداع والسحب</title>
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<!-- شاشة الافتتاح -->
<div id="splash">
  <canvas id="splashCanvas"></canvas>
  <div class="splash-center">
    <div id="splashLogo" class="splash-logo">QnS</div>
    <div id="splashLine" class="splash-line"><i></i><b></b><i></i></div>
    <div id="splashCredit" class="splash-credit">تطوير وتنفيذ <strong>أمجد حبيب</strong></div>
  </div>
</div>

<!-- شاشة القفل -->
<div id="lock" hidden></div>

<!-- التطبيق -->
<div id="app" hidden>
  <header id="topbar"></header>
  <main id="view"></main>
  <nav id="nav"></nav>
</div>

<div id="sheetWrap" hidden><div class="sheet-backdrop" data-act="closeSheet"></div><section id="sheet" role="dialog"></section></div>
<div id="dialogWrap" hidden><div id="dialog" role="alertdialog"></div></div>
<div id="toast" hidden></div>
<input type="file" id="fileInput" accept=".json,application/json" hidden>

<script src="vendor/xlsx.mini.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
