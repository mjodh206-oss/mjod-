name: rattib
description: تطبيق رَتِّبْ لتنظيم الراتب والميزانية الشخصية — تنفيذ وتطوير أمجد حبيب.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  fl_chart: 0.70.2
  lottie: ^3.3.1
  flutter_local_notifications: 19.5.0
  timezone: ^0.10.1
  audioplayers: ^6.1.0
  local_auth: 2.3.0
  pdf: ^3.11.3
  path_provider: ^2.1.5
  share_plus: 10.1.4
  file_picker: 8.3.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_icon.png
    - assets/lottie/
    - assets/sounds/
    - assets/fonts/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-ExtraBold.ttf
          weight: 800
